# Exercise 5 - Continuous Integration
# David Rees
#
# This workflow runs automatically when code is pushed to main.
# It installs Python and the project's required modules,
# then runs the unit tests using Pytest.

name: Davids Job

# Controls when the workflow will run
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows the workflow to be run manually from the Actions tab
  workflow_dispatch:

jobs:
  build:

    # Use a GitHub-hosted Ubuntu machine
    runs-on: ubuntu-latest

    steps:

      # Check out the repository so the workflow can access the project files
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install the latest available Python 3 version
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Install the modules listed in requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      # Run the unit tests created in Exercise 4
      - name: Run Pytest
        run: pytest testing_module.py -v



      # Demonstrate using a GitHub repository secret
      - name: Use GitHub secret
        env:
          ACT5P2_LIBRARY_SECRET: ${{ secrets.ACT5P2_LIBRARY_SECRET }}
        run: |
          if [ -n "$ACT5P2_LIBRARY_SECRET" ]; then
            echo "GitHub secret was successfully accessed"
          else
            echo "GitHub secret was not available"
            exit 1
          fi



      # Display confirmation if all previous steps have succeeded
      - name: Pipeline completed
        run: echo "David Rees - Library application tests completed successfully"
